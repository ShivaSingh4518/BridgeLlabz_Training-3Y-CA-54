<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The title sets the text shown in the browser tab. -->
    <title>Important Head Elements</title>

    <!-- The meta charset defines the character encoding. -->
    <meta charset="UTF-8">

    <!-- The description provides a summary of the page. -->
    <meta name="description" content="A demonstration of important HTML head elements.">

    <!-- The author identifies the creator of the page. -->
    <meta name="author" content="Shiva">

    <!-- The base tag sets the base URL for relative links. -->
    <base href="https://example.com/">

    <!-- The link tag can connect external resources such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag contains CSS; it is intentionally empty for this assignment. -->
    <style>
    </style>

    <!-- The script tag contains JavaScript; it is intentionally empty for this assignment. -->
    <script>
    </script>
</head>
<body>
    <h1>Important Head Elements</h1>
    <p>This page demonstrates the required elements inside the head section.</p>
</body>
</html>
