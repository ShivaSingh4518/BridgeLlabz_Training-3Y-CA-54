<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>External Website Embed</title>
</head>
<body>
    <!-- Question 14: External website embedded using an iframe. -->
    <h1>Wikipedia</h1>
    <iframe
        src="https://www.wikipedia.org/"
        width="100%"
        height="500"
        title="Wikipedia website">
    </iframe>
    <p>Some websites may not allow embedding for security reasons.</p>
</body>
</html>
