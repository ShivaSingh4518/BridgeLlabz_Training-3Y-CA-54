<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>
    <!-- Question 2: Google Map embedded using an iframe. -->
    <h1>My City Map</h1>
    <iframe
        src="https://www.google.com/maps?q=Lucknow%2C%20India&output=embed"
        title="Google Map of Lucknow"
        width="100%"
        height="450"
        loading="lazy">
    </iframe>
    <!-- loading="lazy" delays loading the iframe until it is close to the visible area. -->
</body>
</html>
